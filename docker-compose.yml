version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: storefront_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: storefront_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: storefront_backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/storefront_dev
      NODE_ENV: development
    env_file:
      - ./apps/backend/.env
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
  rembg-service:
    build:
      context: ./services/image-processor
      dockerfile: Dockerfile
    container_name: storefront-rembg-service
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
    restart: always
volumes:
  postgres_data: